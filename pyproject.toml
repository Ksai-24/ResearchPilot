[project]
name = "aira-researchagent"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "openai>=1.14.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.8",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "mysql-connector-python>=8.0.0",
    "cryptography>=42.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    ".venv/Lib/site-packages",
]

[tool.pyrefly]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    ".venv/Lib/site-packages",
]
